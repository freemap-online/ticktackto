
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Myfont Tic-Tac-Toe</title>

<style>
@font-face {
    font-family: "Myfont";
    src: url("./Myfont-Regular.ttf") format("truetype");
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f5f5f5;
    font-family: Arial, sans-serif;
}

.game {
    text-align: center;
}

h1 {
    margin: 0 0 10px;
    font-size: 36px;
}

.status {
    font-size: 20px;
    margin-bottom: 20px;
    min-height: 28px;
}

.board {
    width: min(90vw, 420px);
    height: min(90vw, 420px);

    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);

    border: 4px solid #222;
    background: #222;
    gap: 4px;
}

.cell {
    border: none;
    background: white;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    font-family: "Myfont", sans-serif;
    font-size: clamp(55px, 18vw, 110px);

    line-height: 1;

    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

.cell:hover {
    background: #eeeeee;
}

.cell:active {
    background: #dddddd;
}

.reset {
    margin-top: 25px;

    padding: 12px 25px;

    border: none;
    border-radius: 10px;

    background: #222;
    color: white;

    font-size: 17px;

    cursor: pointer;
}

.reset:hover {
    background: #444;
}
</style>
</head>

<body>

<div class="game">

    <h1>틱택토</h1>

    <div class="status" id="status">
        X 차례
    </div>

    <div class="board" id="board">
        <button class="cell" data-index="0"></button>
        <button class="cell" data-index="1"></button>
        <button class="cell" data-index="2"></button>

        <button class="cell" data-index="3"></button>
        <button class="cell" data-index="4"></button>
        <button class="cell" data-index="5"></button>

        <button class="cell" data-index="6"></button>
        <button class="cell" data-index="7"></button>
        <button class="cell" data-index="8"></button>
    </div>

    <button class="reset" id="reset">
        다시 시작
    </button>

</div>

<script>
const cells = document.querySelectorAll(".cell");
const statusText = document.getElementById("status");
const resetButton = document.getElementById("reset");

let board = [
    "",
    "",
    "",
    "",
    "",
    "",
    "",
    ""
];

let currentPlayer = "X";
let gameOver = false;


/*
    사용자의 폰트에서

    8 = O
    9 = X

    따라서 화면에는 실제 O/X 문자를 넣지 않고
    폰트의 8/9 글리프를 넣는다.
*/
function fontCharacter(player) {
    if (player === "O") {
        return "8";
    }

    return "9";
}


const winningPatterns = [
    [0, 1, 2],
    [3, 4, 5],
    [6, 7, 8],

    [0, 3, 6],
    [1, 4, 7],
    [2, 5, 8],

    [0, 4, 8],
    [2, 4, 6]
];


function checkWinner() {

    for (const pattern of winningPatterns) {

        const a = pattern[0];
        const b = pattern[1];
        const c = pattern[2];

        if (
            board[a] !== "" &&
            board[a] === board[b] &&
            board[a] === board[c]
        ) {
            return board[a];
        }
    }

    if (board.every(cell => cell !== "")) {
        return "DRAW";
    }

    return null;
}


function handleCellClick(event) {

    if (gameOver) {
        return;
    }

    const index = Number(event.currentTarget.dataset.index);

    // 이미 놓인 칸
    if (board[index] !== "") {
        return;
    }

    // 내부 데이터에는 O/X를 저장
    board[index] = currentPlayer;

    // 화면에는 폰트의 8/9를 출력
    event.currentTarget.textContent =
        fontCharacter(currentPlayer);

    const result = checkWinner();

    if (result === "X") {

        statusText.textContent = "X 승리!";
        gameOver = true;
        return;

    }

    if (result === "O") {

        statusText.textContent = "O 승리!";
        gameOver = true;
        return;

    }

    if (result === "DRAW") {

        statusText.textContent = "무승부!";
        gameOver = true;
        return;

    }

    // 플레이어 변경
    currentPlayer =
        currentPlayer === "X" ? "O" : "X";

    statusText.textContent =
        currentPlayer + " 차례";
}


function resetGame() {

    board = [
        "",
        "",
        "",
        "",
        "",
        "",
        "",
        ""
    ];

    currentPlayer = "X";
    gameOver = false;

    cells.forEach(cell => {
        cell.textContent = "";
    });

    statusText.textContent = "X 차례";
}


cells.forEach(cell => {
    cell.addEventListener("click", handleCellClick);
});

resetButton.addEventListener("click", resetGame);
</script>

</body>
</html>
